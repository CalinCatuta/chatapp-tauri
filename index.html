<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local Discord</title>
    <link rel="stylesheet" href="./src/ui/styles/main.css" />
    <link rel="stylesheet" href="./src/./ui/styles/sidebar.css" />
    <link rel="stylesheet" href="./src/./ui/styles/chat.css" />
  </head>
  <body>
    <div id="app-container">
      <aside id="sidebar-view">
        <div class="sidebar-header">
          <h3>Friends</h3>
          <button id="btn-settings" aria-label="Settings">⚙️</button>
        </div>
        <div id="friends-list" class="scrollable">
          </div>
      </aside>

      <main id="chat-view">
        <header class="chat-header">
          <h3 id="current-chat-name">Select a friend to start chatting</h3>
        </header>
        <div id="message-container" class="scrollable">
          </div>
        <div class="chat-input-area">
          <textarea id="message-input" placeholder="Message..." disabled></textarea>
        </div>
      </main>

      <div id="settings-modal" class="hidden">
        </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
